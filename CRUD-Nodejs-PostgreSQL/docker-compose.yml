services:
  app:
    image: manhumann/nodejs-postgres-app:v1
    container_name: nodejs_app
    restart: unless-stopped
    ports:
      - 4000:4000
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: